[project]
name = "text2sql"
version = "0.1.0"
description = "Tiered Text2SQL agent for bank risk analytics: semantic-layer-first, generation-fallback"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai>=1.60",
    "anthropic>=0.60",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "sqlglot>=26.0",
    "fastembed>=0.5",
    "numpy>=1.26",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]

[project.scripts]
t2s = "text2sql.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
