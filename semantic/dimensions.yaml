# 语义层：多对一关系图、时间粒度、维度与枚举值映射
# 编译器只沿 join_graph 声明的多对一方向寻路，从构造上避免 JOIN 扇出导致的重复计数。
# 维度值的 aliases 用于值链接：把用户口语（如"取现"）确定性映射为库内编码（如 'VYBER'）。

join_graph:
  - {from: trans, to: account, condition: "trans.account_id = account.account_id"}
  - {from: loan, to: account, condition: "loan.account_id = account.account_id"}
  - {from: card, to: disp, condition: "card.disp_id = disp.disp_id"}
  - {from: disp, to: account, condition: "disp.account_id = account.account_id"}
  - {from: account, to: district, condition: "account.district_id = district.district_id"}
  # 账户所有人：disp 限定 OWNER 后与账户一一对应，保证多对一
  - {from: account, to: owner_disp, table: disp, condition: "owner_disp.account_id = account.account_id AND owner_disp.type = 'OWNER'"}
  - {from: owner_disp, to: owner_client, table: client, condition: "owner_client.client_id = owner_disp.client_id"}
  - {from: dwd_risk_event, to: district, condition: "dwd_risk_event.district_id = district.district_id"}
  - {from: dwd_risk_event, to: account, condition: "dwd_risk_event.account_id = account.account_id"}

time_grains:
  day: {label: 日, sql: "strftime('%Y-%m-%d', {col})"}
  month: {label: 月, sql: "strftime('%Y-%m', {col})"}
  quarter: {label: 季度, sql: "strftime('%Y', {col}) || '-Q' || ((CAST(strftime('%m', {col}) AS INTEGER) + 2) / 3)"}
  year: {label: 年, sql: "strftime('%Y', {col})"}

